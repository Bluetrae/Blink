<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rulink · Surge App Rule-Set</title>
    <meta
      name="description"
      content="Rulink 把经过审计的上游 App 规则保守转换为 Surge Rule-Set，通过稳定 URL 分发。集中展示全部规则集，一键复制接入。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        // 8:00–22:00 light, 22:00–8:00 dark
        var hour = new Date().getHours();
        if (hour < 8 || hour >= 22) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
