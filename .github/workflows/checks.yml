name: Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  golden-byte:
    # AGENTS.md 核心不变量：Surge / Loon / Shadowrocket / Stash 四个
    # classical 目录必须逐字节相同。任何 push 都自动断言，防止
    # 生成产物被手工改散或渲染器出现隐性分叉。
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Assert four classical dirs are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          for d in Loon Shadowrocket Stash; do
            if ! diff -rq Surge "$d" > /dev/null; then
              echo "::error::$d differs from Surge — the four classical dirs must stay byte-identical"
              diff -r Surge "$d" | head -50
              exit 1
            fi
            echo "ok: Surge == $d"
          done

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check --requirement engine/requirements-dev.txt
      - name: ruff check
        run: ruff check engine/
      - name: ruff format check
        run: ruff format --check engine/

  lint-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/portal
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx}"
      - name: Typecheck
        run: npx tsc --noEmit
