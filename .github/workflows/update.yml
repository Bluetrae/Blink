name: Update Surge Rule-Sets

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. This is 02:17 in China Standard Time (UTC+8).
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: update-surge-rule-sets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned dependency
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build all enabled Rule-Sets
        run: python scripts/build.py --write

      - name: Detect generated changes
        id: generated
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- Surge)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated Rule-Sets
        if: steps.generated.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Surge
          git commit -m "chore: update generated Surge rule-sets · $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase origin main
          git push
