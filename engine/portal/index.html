<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blink · 多客户端规则与配置</title>
    <meta
      name="description"
      content="个人多客户端代理规则与配置：Surge / Shadowrocket / Loon / Stash / Egern / Quantumult X，规则每日更新、配置一键导入。"
    />
    <meta property="og:title" content="Blink · 多客户端规则与配置" />
    <meta
      property="og:description"
      content="个人多客户端代理规则与配置：Surge / Shadowrocket / Loon / Stash / Egern / Quantumult X，规则每日更新、配置一键导入。"
    />
    <link rel="icon" href="blink-logo.png" type="image/png" />
    <script>
      (function () {
        // Default dark theme; keep the user's manual choice if stored.
        try {
          if (localStorage.getItem("blink-theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
