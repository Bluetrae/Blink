<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blink · 多客户端规则与配置</title>
    <meta
      name="description"
      content="Blink 把经过审计的上游 App 规则渲染为 Surge / Shadowrocket / Loon / Stash / Egern / Quantumult X 六种客户端格式，并提供六客户端完整配置文件（单订阅池、占位符已内置）。规则每日自动更新，配置人工维护；网页支持一键复制接入与 iOS 一键导入。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        // 8:00–22:00 light, 22:00–8:00 dark
        var hour = new Date().getHours();
        if (hour < 8 || hour >= 22) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
