# ============================================================
# Blink 候选配置 · Surge
# 单订阅池（Sub）：导入前把 https://YOUR-SUBSCRIPTION-URL 替换为你的订阅链接。
# 策略组与规则引用由 Blink 统一维护；本文件为人工维护层，不随规则每日自动更新。
# ============================================================

[General]
loglevel = notify
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://1.1.1.1/generate_204
test-timeout = 5
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://doh.pub/dns-query, https://dns.alidns.com/dns-query
hijack-dns = *:53
ipv6 = false
ipv6-vif = auto
udp-policy-not-supported-behaviour = REJECT
udp-priority = false
show-error-page-for-reject = true

[Proxy Group]
Sub = select, policy-path=https://YOUR-SUBSCRIPTION-URL, update-interval=86400, no-alert=0, hidden=0, include-all-proxies=0
Proxy = select, HK,TW,JP,US,SG,Final,Sub, no-alert=0, hidden=0, include-all-proxies=0
Final = select, HK,TW,JP,US,SG,Auto,Sub,DIRECT, no-alert=0, hidden=0, include-all-proxies=0
Daily = select, HK,TW,JP,US,SG,Final, no-alert=0, hidden=0, include-all-proxies=0
Telegram = select, SG,HK,JP,TW,US,Final, no-alert=0, hidden=0, include-all-proxies=0
AI = select, HK,TW,JP,US,Final, no-alert=0, hidden=0, include-all-proxies=0
AppleMusic = select, DIRECT,HK,TW,JP,US, no-alert=0, hidden=0, include-all-proxies=0
HK = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="Sub", policy-regex-filter=(?i)(香港|🇭🇰|Hong\s*Kong|HongKong|HKG|(?:^|[^A-Za-z])HK(?:G)?(?:[^A-Za-z]|$))
TW = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="Sub", policy-regex-filter=(?i)(台湾|台灣|🇹🇼|Taiwan|Taipei|TWN|(?:^|[^A-Za-z])TW(?:N)?(?:[^A-Za-z]|$))
JP = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="Sub", policy-regex-filter=(?i)(日本|🇯🇵|Japan|Tokyo|Osaka|Sakura|SoftBank|JPN|(?:^|[^A-Za-z])JP(?:N)?(?:[^A-Za-z]|$))
US = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="Sub", policy-regex-filter=(?i)(美国|美國|🇺🇸|United\s*States|America|USA|US\s*Premium|(?:^|[^A-Za-z])US(?:A)?(?:[^A-Za-z]|$))
SG = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="Sub", policy-regex-filter=(?i)(新加坡|狮城|獅城|🇸🇬|Singapore|SGP|SGGS|(?:^|[^A-Za-z])SG(?:P)?(?:[^A-Za-z]|$))
Auto = url-test, HK,TW,JP,US,SG, interval=600, tolerance=80, no-alert=1, hidden=1, include-all-proxies=0

[Rule]
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-drop.conf,REJECT-DROP
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject.conf,REJECT
RULE-SET,https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Extra/Reject/Tracking.list,REJECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/lan.conf,DIRECT
DEST-PORT,123,DIRECT
DOMAIN,app-site-association.cdn-apple.com,REJECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,DIRECT
RULE-SET,https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Apple.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/WeChat/WeChat.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/DouYin/DouYin.list,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/cdn.conf,Proxy
RULE-SET,https://ruleset.skk.moe/List/ip/domestic.conf,DIRECT,no-resolve
RULE-SET,https://ruleset.skk.moe/List/ip/china_ip.conf,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/Bluetrae/Blink/main/Surge/YouTube.list,Daily
RULE-SET,https://raw.githubusercontent.com/Bluetrae/Blink/main/Surge/X.list,Daily
RULE-SET,https://raw.githubusercontent.com/Bluetrae/Blink/main/Surge/Instagram.list,Daily
RULE-SET,https://raw.githubusercontent.com/Bluetrae/Blink/main/Surge/Telegram.list,Telegram
RULE-SET,https://raw.githubusercontent.com/Bluetrae/Blink/main/Surge/AI.list,AI
RULE-SET,https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/AppleMusic.list,AppleMusic
FINAL,Final,dns-failed

[Host]
# iosapps.itunes.apple.com = iosapps.itunes.apple.com.download.ks-cdn.com

[Header Rewrite]
http-request (raw|gist).githubusercontent.com header-replace Accept-Language en-us

