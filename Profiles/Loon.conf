# ============================================================
# Blink 配置文件 · Loon
# 导入前在 App 内添加你的订阅节点；地区组通过 [Remote Filter] 正则筛选全部节点。
# 策略组与规则引用由 Blink 统一维护；本文件为人工维护层，不随规则每日自动更新。
# ============================================================

[General]
ip-mode = ipv4-only
dns-server = 223.5.5.5,119.29.29.29
proxy-test-url = http://1.1.1.1/generate_204
internet-test-url = http://wifi.vivo.com.cn/generate_204
test-timeout = 5
disconnect-on-policy-change = true

[Proxy]

[Remote Proxy]
# 在 App 内添加订阅节点；地区组通过 [Remote Filter] 正则筛选全部节点。

[Remote Filter]
HK = NameRegex, FilterKey = (?i)(香港|🇭🇰|Hong\s*Kong|HongKong|HKG|(?:^|[^A-Za-z])HK(?:G)?(?:[^A-Za-z]|$))
TW = NameRegex, FilterKey = (?i)(台湾|台灣|🇹🇼|Taiwan|Taipei|TWN|(?:^|[^A-Za-z])TW(?:N)?(?:[^A-Za-z]|$))
JP = NameRegex, FilterKey = (?i)(日本|🇯🇵|Japan|Tokyo|Osaka|Sakura|SoftBank|JPN|(?:^|[^A-Za-z])JP(?:N)?(?:[^A-Za-z]|$))
US = NameRegex, FilterKey = (?i)(美国|美國|🇺🇸|United\s*States|America|USA|US\s*Premium|(?:^|[^A-Za-z])US(?:A)?(?:[^A-Za-z]|$))
SG = NameRegex, FilterKey = (?i)(新加坡|狮城|獅城|🇸🇬|Singapore|SGP|SGGS|(?:^|[^A-Za-z])SG(?:P)?(?:[^A-Za-z]|$))

[Proxy Group]
Proxy = select, HK,TW,JP,US,SG,Final
Final = select, HK,TW,JP,US,SG,Auto,DIRECT
Daily = select, HK,TW,JP,US,SG,Final
Telegram = select, SG,HK,JP,TW,US,Final
AI = select, HK,TW,JP,US,Final
AppleMusic = select, DIRECT,HK,TW,JP,US
Auto = url-test, HK,TW,JP,US,SG, interval=600, tolerance=80

[Rule]
DEST-PORT,123,DIRECT
DOMAIN,app-site-association.cdn-apple.com,REJECT
FINAL,Final

[Remote Rule]
https://ruleset.skk.moe/List/non_ip/reject-drop.conf, policy = REJECT-DROP, tag = reject-drop, enabled = true
https://ruleset.skk.moe/List/non_ip/reject.conf, policy = REJECT, tag = reject, enabled = true
https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Extra/Reject/Tracking.list, policy = REJECT, tag = tracking, enabled = true
https://ruleset.skk.moe/List/non_ip/lan.conf, policy = DIRECT, tag = lan, enabled = true
https://ruleset.skk.moe/List/non_ip/apple_cn.conf, policy = DIRECT, tag = apple-cn, enabled = true
https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Apple.list, policy = DIRECT, tag = apple, enabled = true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/WeChat/WeChat.list, policy = DIRECT, tag = wechat, enabled = true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/DouYin/DouYin.list, policy = DIRECT, tag = douyin, enabled = true
https://ruleset.skk.moe/List/non_ip/domestic.conf, policy = DIRECT, tag = domestic, enabled = true
https://ruleset.skk.moe/List/non_ip/cdn.conf, policy = Proxy, tag = cdn, enabled = true
https://ruleset.skk.moe/List/ip/domestic.conf, policy = DIRECT, tag = china-ip, enabled = true
https://ruleset.skk.moe/List/ip/china_ip.conf, policy = DIRECT, tag = china-ip2, enabled = true
https://raw.githubusercontent.com/Bluetrae/Blink/main/Surge/YouTube.list, policy = Daily, tag = YouTube, enabled = true
https://raw.githubusercontent.com/Bluetrae/Blink/main/Surge/X.list, policy = Daily, tag = X, enabled = true
https://raw.githubusercontent.com/Bluetrae/Blink/main/Surge/Instagram.list, policy = Daily, tag = Instagram, enabled = true
https://raw.githubusercontent.com/Bluetrae/Blink/main/Surge/Telegram.list, policy = Telegram, tag = Telegram, enabled = true
https://raw.githubusercontent.com/Bluetrae/Blink/main/Surge/AI.list, policy = AI, tag = AI, enabled = true
https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/AppleMusic.list, policy = AppleMusic, tag = AppleMusic, enabled = true

