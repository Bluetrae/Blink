# ============================================================
# Blink 配置文件 · Clash（Mihomo 内核 / Android 通用）
# 单订阅池（Sub）：导入前把 https://YOUR-SUBSCRIPTION-URL 替换为你的订阅链接。
# 策略组与规则引用由 Blink 统一维护；本文件为人工维护层，不随规则每日自动更新。
# 目标客户端：Clash Meta for Android / FLClash（Mihomo 内核，完整兼容）。
# CFA（Clash Premium 内核，已停更）部分兼容：不支持 format / mrs / size-limit
# 等 Meta 扩展字段，导入时可能被忽略。
# Blink 规则经 Clash/ 目录分发：classical 已显式去除 USER-AGENT（内核无此类型），
# 构建报告计数，绝不让内核静默跳过。
# ============================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
keep-alive-interval: 15

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxy-providers:
  Sub:
    type: http
    url: https://YOUR-SUBSCRIPTION-URL
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000

proxy-groups:
  - {name: Proxy, type: select, proxies: [HK,TW,JP,US,SG,Final]}
  - {name: Final, type: select, proxies: [HK,TW,JP,US,SG,Auto,DIRECT]}
  - {name: Daily, type: select, proxies: [HK,TW,JP,US,SG,Final]}
  - {name: Telegram, type: select, proxies: [SG,HK,JP,TW,US,Final]}
  - {name: AI, type: select, proxies: [HK,TW,JP,US,Final]}
  - {name: AppleMusic, type: select, proxies: [DIRECT,HK,TW,JP,US]}
  - {name: HK, type: select, use: [Sub], filter: '(?i)(香港|🇭🇰|Hong\s*Kong|HongKong|HKG|(?:^|[^A-Za-z])HK(?:G)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: TW, type: select, use: [Sub], filter: '(?i)(台湾|台灣|🇹🇼|Taiwan|Taipei|TWN|(?:^|[^A-Za-z])TW(?:N)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: JP, type: select, use: [Sub], filter: '(?i)(日本|🇯🇵|Japan|Tokyo|Osaka|Sakura|SoftBank|JPN|(?:^|[^A-Za-z])JP(?:N)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: US, type: select, use: [Sub], filter: '(?i)(美国|美國|🇺🇸|United\s*States|America|USA|US\s*Premium|(?:^|[^A-Za-z])US(?:A)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: SG, type: select, use: [Sub], filter: '(?i)(新加坡|狮城|獅城|🇸🇬|Singapore|SGP|SGGS|(?:^|[^A-Za-z])SG(?:P)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: Auto, type: url-test, proxies: [HK,TW,JP,US,SG], url: http://cp.cloudflare.com/generate_204, interval: 600, tolerance: 80}

rule-providers:
  reject_drop:
    type: http
    behavior: classical
    format: text
    url: https://ruleset.skk.moe/List/non_ip/reject-drop.conf
